name: Compilation Geant4

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    container:
      image: carlomt/geant4:11.4.1-gui

    

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Verifier Geant4
        run: geant4-config --version

      - name: Configurer Cmake
        run: cmake -S . -B build -DWITH_GEANT4UIVIS=OFF

      - name: Compiler
        run: cmake --build build --parallel 4
